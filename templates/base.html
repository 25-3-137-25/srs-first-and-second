<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Мини-аукцион коллекционных резиновых уток">
    <title>{% block title %}DuckAuction — Аукцион Резиновых Уток{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="main-header">
        <div class="container header-inner">
            <a href="{{ url_for('index') }}" class="logo" aria-label="DuckAuction — главная">
                <span class="logo-icon">🦆</span> DuckAuction
            </a>
            <nav class="main-nav" aria-label="Основная навигация">
                <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Главная</a>
                <a href="{{ url_for('catalog') }}" class="{% if request.endpoint == 'catalog' %}active{% endif %}">Каталог</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="main-footer">
        <div class="container footer-inner">
            <p>&copy; 2026 DuckAuction. Мини-проект на Flask.</p>
            <a href="{{ url_for('catalog') }}">Перейти к каталогу</a>
        </div>
    </footer>
</body>
</html>
