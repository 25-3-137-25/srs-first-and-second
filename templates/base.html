<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Аукцион Резиновых Уток{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <a href="{{ url_for('index') }}" class="logo">🦆 DuckAuction</a>
            <nav class="main-nav">
                <a href="{{ url_for('index') }}">Главная</a>
                <a href="{{ url_for('catalog') }}">Каталог</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2026 Аукцион Резиновых Уток. Все права защищены.</p>
        </div>
    </footer>
</body>
</html>
